name: Redirect GitHub Pages to the canonical site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect pages
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-Hant">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>一日一生｜正在前往最新網站</title>
              <meta name="robots" content="noindex">
            </head>
            <body>
              <p>正在前往最新版本……</p>
              <p><a id="fallback" href="https://iconic-daily.imlollipop33.chatgpt.site/">如果沒有自動跳轉，請點此進入一日一生。</a></p>
              <script>
                (function () {
                  var canonical = "https://iconic-daily.imlollipop33.chatgpt.site";
                  var path = window.location.pathname.replace(/^\/iconic-daily(?=\/|$)/, "") || "/";
                  var target = canonical + path + window.location.search + window.location.hash;
                  document.getElementById("fallback").href = target;
                  window.location.replace(target);
                })();
              </script>
            </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
